<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Individual Shop Owner workspace mockup</title>
  <desc id="desc">A clean SoleSpace individual shop owner sidebar with Retail, Repair, Cashier, and Stock Management as the owner-operated modules. Retail and Repair POS entries are nested under Cashier. Only applicable owner approvals are shown. Logistics is not shown.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="hero" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="#f8fafc"/>

  <!-- Sidebar -->
  <rect width="300" height="1000" fill="#ffffff"/>
  <rect x="299" width="1" height="1000" fill="#e2e8f0"/>
  <text x="28" y="54" fill="#1d4ed8" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800">SoleSpace</text>

  <text x="28" y="105" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">HOME</text>
  <g font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#334155">
    <rect x="20" y="120" width="258" height="42" rx="9" fill="#eff6ff"/>
    <circle cx="43" cy="141" r="9" fill="none" stroke="#2563eb" stroke-width="2"/>
    <text x="66" y="147" fill="#1d4ed8">Home</text>
    <circle cx="43" cy="183" r="9" fill="none" stroke="#64748b" stroke-width="2"/>
    <text x="66" y="189">Assist Center</text>
  </g>

  <text x="28" y="230" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">APPROVAL CENTER</text>
  <g font-family="Inter, Arial, sans-serif" fill="#334155">
    <rect x="20" y="245" width="258" height="42" rx="9" fill="#f8fafc"/>
    <rect x="35" y="258" width="16" height="18" rx="2" fill="none" stroke="#64748b" stroke-width="2"/>
    <path d="M39 263h8M39 268h8" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <text x="66" y="272" font-size="15" font-weight="700">Approval Center</text>
    <path d="M247 263l5 5 5-5" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M44 287v30" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
    <g font-size="13" font-weight="600">
      <path d="M44 307h10" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="66" y="312">Refund Approvals</text>
    </g>
  </g>

  <text x="28" y="374" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">OPERATE</text>
  <g font-family="Inter, Arial, sans-serif" fill="#334155">
    <!-- Retail parent and connected pages -->
    <rect x="20" y="389" width="258" height="42" rx="9" fill="#f8fafc"/>
    <rect x="35" y="401" width="16" height="15" rx="2" fill="none" stroke="#64748b" stroke-width="2"/>
    <text x="66" y="416" font-size="15" font-weight="700">Retail</text>
    <path d="M247 409l5 5 5-5" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M44 431v88" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
    <g font-size="13" font-weight="600">
      <path d="M44 451h10" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="66" y="456">Job Orders Retail</text>
      <path d="M44 477h10" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="66" y="482">Product Management</text>
      <path d="M44 503h10" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="66" y="508">Vouchers &amp; Discount</text>
    </g>

    <!-- Repair parent and connected pages -->
    <rect x="20" y="531" width="258" height="42" rx="9" fill="#f8fafc"/>
    <path d="M35 551h16M43 543v16" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <text x="66" y="558" font-size="15" font-weight="700">Repair</text>
    <path d="M44 573v114" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
    <g font-size="13" font-weight="600">
      <path d="M44 593h10" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="66" y="598">Job Orders Repair</text>
      <path d="M44 619h10" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="66" y="624">Warranty Queue</text>
      <path d="M44 645h10" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="66" y="650">Services Management</text>
      <path d="M44 671h10" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="66" y="676">Repair Support</text>
    </g>

    <!-- Shared cashier parent for both POS workflows -->
    <rect x="20" y="699" width="258" height="42" rx="9" fill="#f8fafc"/>
    <rect x="34" y="712" width="19" height="14" rx="2" fill="none" stroke="#64748b" stroke-width="2"/>
    <text x="66" y="726" font-size="15" font-weight="700">Cashier</text>
    <path d="M247 717l5 5 5-5" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M44 741v57" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
    <g font-size="13" font-weight="600">
      <path d="M44 761h10" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="66" y="766">Retail POS</text>
      <path d="M44 787h10" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="66" y="792">Repair POS</text>
    </g>

    <!-- Shared stock parent for products and repair materials -->
    <rect x="20" y="810" width="258" height="42" rx="9" fill="#f8fafc"/>
    <path d="M35 831l8-4 8 4-8 4-8-4zm0 5l8 4 8-4m-16 5l8 4 8-4" fill="none" stroke="#64748b" stroke-width="1.8"/>
    <text x="66" y="837" font-size="15" font-weight="700">Stock Management</text>
    <path d="M247 828l5 5 5-5" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M44 852v57" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
    <g font-size="13" font-weight="600">
      <path d="M44 872h10" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="66" y="877">Product Stock</text>
      <path d="M44 898h10" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="66" y="903">Repair Materials</text>
    </g>
  </g>

  <!-- Top bar -->
  <rect x="300" width="1300" height="86" fill="#ffffff"/>
  <rect x="300" y="85" width="1300" height="1" fill="#e2e8f0"/>
  <rect x="330" y="23" width="44" height="40" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <path d="M344 35h17M344 43h17M344 51h17" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <text x="396" y="50" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">SoleSpace</text>
  <rect x="540" y="23" width="350" height="40" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="562" y="49" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="14">Search or type command...</text>
  <circle cx="1450" cy="43" r="17" fill="#eff6ff"/>
  <circle cx="1450" cy="43" r="6" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="1490" y="37" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">Urban Kicks Store</text>
  <text x="1490" y="56" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="12">Individual Shop Owner</text>

  <!-- Main content -->
  <text x="350" y="145" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800">Individual Shop Workspace</text>
  <text x="350" y="176" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="15">Run retail sales and repair operations from one place.</text>
  <rect x="1260" y="128" width="250" height="52" rx="12" fill="#ecfdf5" stroke="#bbf7d0"/>
  <circle cx="1284" cy="154" r="7" fill="#10b981"/>
  <text x="1302" y="151" fill="#047857" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="1">INDIVIDUAL ACCOUNT</text>
  <text x="1302" y="167" fill="#059669" font-family="Inter, Arial, sans-serif" font-size="12">Owner-operated access</text>

  <rect x="350" y="215" width="1160" height="150" rx="16" fill="url(#hero)" stroke="#bfdbfe" filter="url(#shadow)"/>
  <rect x="380" y="245" width="54" height="54" rx="14" fill="#2563eb"/>
  <path d="M394 263h26v18h-26zM399 258h16" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <text x="462" y="255" fill="#2563eb" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="2">OWNER OPERATIONS</text>
  <text x="462" y="285" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800">Everything you need to run the shop</text>
  <text x="462" y="314" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="14">Sell products, manage repairs, serve customers, and keep materials ready.</text>
  <rect x="462" y="330" width="142" height="24" rx="12" fill="#dbeafe"/>
  <text x="481" y="347" fill="#1d4ed8" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">No logistics module</text>

  <text x="350" y="422" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">Your operating snapshot</text>
  <text x="350" y="448" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="14">Quick access to the work you own.</text>
  <g filter="url(#shadow)">
    <rect x="350" y="475" width="265" height="130" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="640" y="475" width="265" height="130" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="930" y="475" width="265" height="130" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="1220" y="475" width="290" height="130" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  </g>
  <g font-family="Inter, Arial, sans-serif">
    <text x="378" y="515" fill="#64748b" font-size="13" font-weight="700">RETAIL WORK</text>
    <text x="378" y="550" fill="#0f172a" font-size="26" font-weight="800">0</text>
    <text x="378" y="577" fill="#64748b" font-size="13">Orders requiring attention</text>
    <text x="668" y="515" fill="#64748b" font-size="13" font-weight="700">REPAIR WORK</text>
    <text x="668" y="550" fill="#0f172a" font-size="26" font-weight="800">0</text>
    <text x="668" y="577" fill="#64748b" font-size="13">Open repair jobs</text>
    <text x="958" y="515" fill="#64748b" font-size="13" font-weight="700">PRODUCT &amp; MATERIAL STOCK</text>
    <text x="958" y="550" fill="#0f172a" font-size="26" font-weight="800">0</text>
    <text x="958" y="577" fill="#64748b" font-size="13">Products and materials to restock</text>
    <text x="1248" y="515" fill="#64748b" font-size="13" font-weight="700">APPROVALS</text>
    <text x="1248" y="550" fill="#0f172a" font-size="26" font-weight="800">0</text>
    <text x="1248" y="577" fill="#64748b" font-size="13">Decisions waiting for you</text>
  </g>

  <rect x="350" y="650" width="1160" height="260" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
  <text x="380" y="694" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">Continue operating</text>
  <text x="380" y="720" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="14">Open a page directly from the Individual owner workflow.</text>
  <g font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">
    <rect x="380" y="752" width="260" height="56" rx="10" fill="#0f172a"/>
    <text x="405" y="786" fill="#ffffff">Job Orders Repair</text>
    <text x="608" y="786" fill="#cbd5e1">↗</text>
    <rect x="660" y="752" width="260" height="56" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="685" y="786" fill="#0f172a">Product &amp; Materials Stock</text>
    <text x="888" y="786" fill="#2563eb">↗</text>
    <rect x="940" y="752" width="260" height="56" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="965" y="786" fill="#0f172a">Cashier</text>
    <text x="1168" y="786" fill="#2563eb">↗</text>
    <rect x="1220" y="752" width="260" height="56" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="1245" y="786" fill="#0f172a">Approval Center</text>
    <text x="1448" y="786" fill="#2563eb">↗</text>
  </g>
  <text x="380" y="858" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="13">Cashier opens both Retail POS and Repair POS. Stock Management combines product inventory and repair materials.</text>
</svg>
